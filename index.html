<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Upgrade - Global Empire</title>
    <style>
        :root {
            --bg-base: #111111;
            --panel-bg: rgba(0, 0, 0, 0.85);
            --text-main: #ffffff;
            --accent: #4CAF50;
            --accent-hover: #45a049;
            --danger: #f44336;
        }
        body { margin: 0; overflow: hidden; background-color: var(--bg-base); color: var(--text-main); font-family: sans-serif; }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; }
        .panel { background: var(--panel-bg); padding: 15px; border-radius: 8px; pointer-events: auto; margin-bottom: 10px; border: 1px solid #333; max-height: 90vh; overflow-y: auto; }
        .left-col { width: 320px; display: flex; flex-direction: column; }
        .right-col { width: 320px; display: flex; flex-direction: column; }
        button { background: var(--accent); color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; margin: 4px 0; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        .danger { background: var(--danger); }
        .danger:hover { background: #da190b; }
        .warning { background: #ff9800; color: black; }
        hr { border-color: #444; margin: 15px 0; }
        h2, h3 { margin-top: 0; color: var(--accent); text-align: center; }
        .city-card { border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); }
        .city-image { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; }
        .city-title { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        select, input[type="color"], input[type="range"] { width: 100%; margin-bottom: 10px; padding: 5px; }
        .menu-icon { font-size: 24px; cursor: pointer; pointer-events: auto; position: absolute; top: 20px; left: 20px; background: var(--panel-bg); padding: 5px 10px; border-radius: 5px; }
        
        /* Modal */
        #settings-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; z-index: 100; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="menu-icon" id="menu-toggle">☰</div>

    <div id="game-ui">
        <div class="left-col" id="main-menu" style="display: none; margin-top: 40px;">
            <div id="auth-panel" class="panel">
                <div id="user-info" style="margin-bottom: 10px;" data-i18n="not_logged_in">Not logged in</div>
                <button id="login-btn" data-i18n="login">Login with Google</button>
                <button id="logout-btn" style="display:none;" class="danger" data-i18n="logout">Logout</button>
            </div>

            <div id="stats-panel" class="panel">
                <h2 data-i18n="title">Global Empire</h2>
                <p><span data-i18n="money">Money</span>: $<span id="money-display">0</span></p>
                <p><span data-i18n="income">Income</span>: $<span id="income-display">0</span> /sec</p>
                <p><span data-i18n="debt">Debt</span>: $<span id="debt-display">0</span></p>
                <p><span data-i18n="crime_penalty">Crime Penalty</span>: -$<span id="crime-display">0</span> /sec</p>
                <p><span data-i18n="rebirths">Rebirths</span>: <span id="rebirth-display">0</span></p>
                <button id="settings-btn" data-i18n="settings">Settings</button>
            </div>

            <div id="actions-panel" class="panel">
                <h3 data-i18n="actions">Actions</h3>
                <button id="click-btn" data-i18n="click_work">Manual Work (+$1)</button>
                <hr>
                <button id="loan-btn" class="warning" data-i18n="take_loan">Take $1,000 Loan (5% interest)</button>
                <button id="pay-loan-btn" data-i18n="pay_loan">Pay Off Debt</button>
                <hr>
                <button id="crime-btn" class="danger" data-i18n="commit_crime">Syndicate Crime (+$500 instantly, -5/sec)</button>
                <button id="clean-crime-btn" data-i18n="clean_crime">Clean Streets ($2000)</button>
                <hr>
                <button id="rebirth-btn" class="danger" data-i18n="rebirth">Rebirth (Requires 10 Cities)</button>
            </div>
        </div>

        <div class="right-col">
            <div id="cities-panel" class="panel" style="flex-grow: 1;">
                <h3 data-i18n="cities">Cities</h3>
                <div id="cities-list"></div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="panel">
        <h3 data-i18n="settings">Settings</h3>
        <label data-i18n="language">Language</label>
        <select id="lang-select">
            <option value="en">English</option>
            <option value="uk">Українська</option>
            <option value="ru">Русский</option>
            <option value="fr">Français</option>
        </select>
        
        <label data-i18n="ui_color">UI Accent Color</label>
        <input type="color" id="color-picker" value="#4CAF50">
        
        <label data-i18n="earth_size">Earth Size</label>
        <input type="range" id="earth-size" min="1" max="4" step="0.1" value="2">
        
        <button id="close-settings" data-i18n="close">Close</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCF7biVmC_tOO-ftLGno3NCZ5tz8erSWm0",
            authDomain: "city-upgrade.firebaseapp.com",
            projectId: "city-upgrade",
            storageBucket: "city-upgrade.firebasestorage.app",
            messagingSenderId: "796551090603",
            appId: "1:796551090603:web:44d4de03e000d3b786c2ee",
            measurementId: "G-J08FL5262N"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 1. TRANSLATIONS
        const i18n = {
            en: { title: "Global Empire", money: "Money", income: "Income", debt: "Debt", crime_penalty: "Crime Penalty", rebirths: "Rebirths", settings: "Settings", actions: "Actions", click_work: "Manual Work (+$1)", take_loan: "Take $1,000 Loan (5% interest)", pay_loan: "Pay Off Debt", commit_crime: "Syndicate Crime (+$500 instantly, -5/sec)", clean_crime: "Clean Streets ($2000)", rebirth: "Rebirth (Req. 10 Cities)", cities: "Cities", pop: "Pop", max_pop: "Max", upgrade: "Upgrade", fix_disaster: "Fix Disaster", login: "Login with Google", logout: "Logout", not_logged_in: "Not logged in", language: "Language", ui_color: "UI Color", earth_size: "Earth Size", close: "Close" },
            uk: { title: "Глобальна Імперія", money: "Гроші", income: "Дохід", debt: "Борг", crime_penalty: "Штраф за злочин", rebirths: "Переродження", settings: "Налаштування", actions: "Дії", click_work: "Ручна робота (+$1)", take_loan: "Взяти кредит $1,000", pay_loan: "Виплатити борг", commit_crime: "Злочин (+$500, -5/сек)", clean_crime: "Очистити вулиці ($2000)", rebirth: "Переродження (Потрібно 10 міст)", cities: "Міста", pop: "Нас.", max_pop: "Макс", upgrade: "Покращити", fix_disaster: "Усунути лихо", login: "Увійти через Google", logout: "Вийти", not_logged_in: "Не в мережі", language: "Мова", ui_color: "Колір інтерфейсу", earth_size: "Розмір Землі", close: "Закрити" },
            ru: { title: "Глобальная Империя", money: "Деньги", income: "Доход", debt: "Долг", crime_penalty: "Штраф за преступность", rebirths: "Перерождения", settings: "Настройки", actions: "Действия", click_work: "Ручная работа (+$1)", take_loan: "Взять кредит $1,000", pay_loan: "Выплатить долг", commit_crime: "Преступление (+$500, -5/сек)", clean_crime: "Очистить улицы ($2000)", rebirth: "Перерождение (Нужно 10 городов)", cities: "Города", pop: "Нас.", max_pop: "Макс", upgrade: "Улучшить", fix_disaster: "Устранить бедствие", login: "Войти через Google", logout: "Выйти", not_logged_in: "Не в сети", language: "Язык", ui_color: "Цвет интерфейса", earth_size: "Размер Земли", close: "Закрыть" },
            fr: { title: "Empire Mondial", money: "Argent", income: "Revenu", debt: "Dette", crime_penalty: "Pénalité de crime", rebirths: "Renaissances", settings: "Paramètres", actions: "Actions", click_work: "Travail manuel (+$1)", take_loan: "Prendre un prêt de 1000$", pay_loan: "Rembourser la dette", commit_crime: "Crime (+$500, -5/s)", clean_crime: "Nettoyer les rues (2000$)", rebirth: "Renaissance (Req. 10 Villes)", cities: "Villes", pop: "Pop", max_pop: "Max", upgrade: "Améliorer", fix_disaster: "Réparer Catastrophe", login: "Connexion Google", logout: "Déconnexion", not_logged_in: "Non connecté", language: "Langue", ui_color: "Couleur UI", earth_size: "Taille de la Terre", close: "Fermer" }
        };

        let currentLang = 'en';
        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(i18n[currentLang][key]) el.textContent = i18n[currentLang][key];
            });
            renderCities();
        }

        // Generate 100 Cities Procedurally with Country Codes for Flags
        const baseCityData = [
            { name: "New York", cc: "us" }, { name: "London", cc: "gb" },
            { name: "Tokyo", cc: "jp" }, { name: "Paris", cc: "fr" },
            { name: "Berlin", cc: "de" }, { name: "Kyiv", cc: "ua" },
            { name: "Moscow", cc: "ru" }, { name: "Beijing", cc: "cn" },
            { name: "Dubai", cc: "ae" }, { name: "Rome", cc: "it" },
            { name: "Toronto", cc: "ca" }, { name: "Sydney", cc: "au" },
            { name: "Mumbai", cc: "in" }, { name: "Cairo", cc: "eg" },
            { name: "Rio", cc: "br" }, { name: "Seoul", cc: "kr" },
            { name: "Madrid", cc: "es" }, { name: "Lagos", cc: "ng" },
            { name: "Jakarta", cc: "id" }, { name: "Lima", cc: "pe" }
        ];

        const baseCities = [];
        for(let i=0; i<100; i++) {
            const base = baseCityData[i % baseCityData.length];
            const name = base.name + (i >= baseCityData.length ? ` ${Math.floor(i/baseCityData.length)+1}` : "");
            baseCities.push({
                id: i, name: name, cc: base.cc, level: 0, pop: 0, maxPop: 100 * (i+1),
                baseCost: 50 * Math.pow(1.2, i), disaster: false
            });
        }

        // 2. GAME STATE
        let state = {
            money: 100, rebirths: 0, debt: 0, crimeLevel: 0,
            cities: JSON.parse(JSON.stringify(baseCities))
        };
        let currentUser = null;

        function getIncome() {
            let income = 0;
            state.cities.forEach(c => {
                if (c.level > 0 && !c.disaster) income += (c.pop * 0.1) * (1 + state.rebirths * 0.5);
            });
            income -= state.crimeLevel * 5;
            income -= state.debt * 0.05; // 5% interest
            return income;
        }

        function updateUI() {
            document.getElementById('money-display').textContent = Math.floor(state.money);
            document.getElementById('income-display').textContent = getIncome().toFixed(1);
            document.getElementById('debt-display').textContent = Math.floor(state.debt);
            document.getElementById('crime-display').textContent = state.crimeLevel * 5;
            document.getElementById('rebirth-display').textContent = state.rebirths;
        }

        function renderCities() {
            const container = document.getElementById('cities-list');
            container.innerHTML = '';
            
            const unlockedCities = state.cities.filter(c => c.level > 0 || c.id === 0 || state.cities[c.id-1].level > 0);
            
            unlockedCities.forEach(city => {
                const cost = Math.floor(city.baseCost * Math.pow(1.5, city.level));
                const fixCost = cost * 0.5;
                const div = document.createElement('div');
                div.className = 'city-card';
                // Dynamic image placeholder
                const imgUrl = `https://placehold.co/400x100/222/FFF?text=${city.name}`;
                // Flag URL using flagcdn
                const flagUrl = `https://flagcdn.com/24x18/${city.cc}.png`;
                
                div.innerHTML = `
                    <img src="${imgUrl}" class="city-image">
                    <div class="city-title">
                        <img src="${flagUrl}" alt="${city.cc}" style="border-radius: 2px; box-shadow: 0 0 2px rgba(255,255,255,0.3);">
                        ${city.name} (Lvl ${city.level})
                    </div>
                    ${i18n[currentLang].pop}: ${Math.floor(city.pop)} / ${city.maxPop}<br>
                    ${city.disaster ? `<span style="color:red; font-weight:bold;">DISASTER STRUCK!</span><br>` : ''}
                    ${city.disaster 
                        ? `<button class="danger" onclick="fixDisaster(${city.id},${fixCost})">${i18n[currentLang].fix_disaster} ($${fixCost})</button>`
                        : `<button onclick="upgradeCity(${city.id},${cost})">${i18n[currentLang].upgrade} ($${cost})</button>`
                    }
                `;
                container.appendChild(div);
            });
        }

        window.upgradeCity = (id, cost) => {
            if (state.money >= cost) {
                state.money -= cost;
                state.cities[id].level++;
                state.cities[id].maxPop += 500;
                renderCities();
                updateUI();
                updateGlobeMarkers();
            }
        };

        window.fixDisaster = (id, cost) => {
            if (state.money >= cost) {
                state.money -= cost;
                state.cities[id].disaster = false;
                renderCities();
                updateUI();
            }
        };

        // Mechanics Buttons
        document.getElementById('click-btn').addEventListener('click', () => {
            state.money += 1; 
            updateUI();
        });

        document.getElementById('loan-btn').addEventListener('click', () => {
            state.money += 1000;
            state.debt += 1000;
            updateUI();
        });

        document.getElementById('pay-loan-btn').addEventListener('click', () => {
            if (state.money >= state.debt && state.debt > 0) {
                state.money -= state.debt;
                state.debt = 0;
                updateUI();
            }
        });

        document.getElementById('crime-btn').addEventListener('click', () => {
            state.money += 500;
            state.crimeLevel += 1;
            updateUI();
        });

        document.getElementById('clean-crime-btn').addEventListener('click', () => {
            if (state.money >= 2000 && state.crimeLevel > 0) {
                state.money -= 2000;
                state.crimeLevel = 0;
                updateUI();
            }
        });

        document.getElementById('rebirth-btn').addEventListener('click', () => {
            const owned = state.cities.filter(c => c.level > 0).length;
            if (owned >= 10) {
                if(confirm("Rebirth? You lose money and cities, but gain permanent income multipliers.")) {
                    state.rebirths++;
                    state.money = 100;
                    state.debt = 0;
                    state.crimeLevel = 0;
                    state.cities = JSON.parse(JSON.stringify(baseCities)); // Reset
                    renderCities();
                    updateGlobeMarkers();
                }
            } else {
                alert("Need 10 active cities!");
            }
        });

        // Game Loop
        setInterval(() => {
            state.money += getIncome();
            
            // Population growth
            state.cities.forEach(c => {
                if (c.level > 0 && c.pop < c.maxPop && !c.disaster) {
                    c.pop += c.level * 2;
                    if (c.pop > c.maxPop) c.pop = c.maxPop;
                }
            });

            // Random Disaster (Rare - 0.1% chance per tick)
            if (Math.random() < 0.001) {
                const active = state.cities.filter(c => c.level > 0 && !c.disaster);
                if (active.length > 0) {
                    const victim = active[Math.floor(Math.random() * active.length)];
                    victim.disaster = true;
                    victim.pop = Math.floor(victim.pop * 0.8); // Lose 20% pop
                    renderCities();
                }
            }

            updateUI();
            if(Math.random() < 0.2) renderCities(); // Throttle UI updates
        }, 1000);

        // UI Controls
        document.getElementById('menu-toggle').addEventListener('click', () => {
            const menu = document.getElementById('main-menu');
            menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
        });

        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('settings-modal').style.display = 'block';
        });
        document.getElementById('close-settings').addEventListener('click', () => {
            document.getElementById('settings-modal').style.display = 'none';
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--accent', e.target.value);
        });

        document.getElementById('lang-select').addEventListener('change', (e) => {
            currentLang = e.target.value;
            applyTranslations();
        });

        // Cloud Save
        async function saveGame() {
            if (!currentUser) return;
            try { await setDoc(doc(db, "users", currentUser.uid), state); } catch (e) {}
        }
        setInterval(saveGame, 10000);

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('user-info').textContent = user.displayName;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'block';
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    state = { ...state, ...docSnap.data() };
                    renderCities();
                    updateGlobeMarkers();
                }
            } else {
                document.getElementById('user-info').textContent = i18n[currentLang].not_logged_in;
                document.getElementById('login-btn').style.display = 'block';
                document.getElementById('logout-btn').style.display = 'none';
            }
        });

        document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // THREE.JS GLOBE
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 6;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        let earthSize = 2;
        const globeGeo = new THREE.SphereGeometry(earthSize, 32, 32);
        const globeMat = new THREE.MeshPhongMaterial({ color: 0x0a192f, flatShading: true });
        const earth = new THREE.Mesh(globeGeo, globeMat);
        scene.add(earth);
        
        const wireframe = new THREE.LineSegments(new THREE.WireframeGeometry(globeGeo), new THREE.LineBasicMaterial({ color: 0x4CAF50, transparent: true, opacity: 0.3 }));
        earth.add(wireframe);

        document.getElementById('earth-size').addEventListener('input', (e) => {
            const scale = parseFloat(e.target.value) / 2;
            earth.scale.set(scale, scale, scale);
        });

        let markers = [];
        function updateGlobeMarkers() {
            markers.forEach(m => earth.remove(m));
            markers = [];
            state.cities.forEach((city, i) => {
                if (city.level > 0) {
                    const marker = new THREE.Mesh(new THREE.SphereGeometry(0.05 + (city.level * 0.01), 16, 16), new THREE.MeshBasicMaterial({ color: city.disaster ? 0xff0000 : 0x00ff00 }));
                    // Procedural distribution around globe
                    const phi = Math.acos(-1 + (2 * i) / 100);
                    const theta = Math.sqrt(100 * Math.PI) * phi;
                    marker.position.setFromSphericalCoords(earthSize, phi, theta);
                    earth.add(marker);
                    markers.push(marker);
                }
            });
        }

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        document.addEventListener('mousedown', (e) => { if(e.target.tagName === 'CANVAS') isDragging = true; });
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                earth.rotation.y += (e.offsetX - previousMousePosition.x) * 0.005;
                earth.rotation.x += (e.offsetY - previousMousePosition.y) * 0.005;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) earth.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        
        applyTranslations();
        renderCities();
        updateGlobeMarkers();
        animate();
    </script>
</body>
</html>
