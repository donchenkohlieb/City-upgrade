<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Upgrade - 3D Idle Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: sans-serif; }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; }
        .panel { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; pointer-events: auto; margin-bottom: 10px; border: 1px solid #333; }
        button { background: #4CAF50; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; margin: 4px 0; font-weight: bold; width: 100%; }
        button:hover { background: #45a049; }
        .danger { background: #f44336; }
        .danger:hover { background: #da190b; }
        #auth-panel { position: absolute; top: 20px; right: 20px; text-align: right; width: 250px; }
        #stats-panel { width: 300px; }
        #actions-panel { position: absolute; bottom: 20px; left: 20px; width: 300px; }
        hr { border-color: #444; margin: 15px 0; }
        h2, h3 { margin-top: 0; color: #4CAF50; }
    </style>
    <!-- Load Three.js directly via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-ui">
        <!-- Authentication & Cloud Save -->
        <div id="auth-panel" class="panel">
            <div id="user-info" style="margin-bottom: 10px;">Not logged in</div>
            <button id="login-btn">Login with Google to Save</button>
            <button id="logout-btn" style="display:none;" class="danger">Logout</button>
        </div>

        <!-- Game Statistics -->
        <div id="stats-panel" class="panel">
            <h2>City Upgrade</h2>
            <p>Money: $<span id="money-display">0</span></p>
            <p>Income: $<span id="income-display">0</span> /sec</p>
            <p>Level: <span id="level-display">1</span></p>
            <p>Rebirths: <span id="rebirth-display">0</span> (x<span id="multiplier-display">1</span> Income)</p>
        </div>

        <!-- Gameplay Actions -->
        <div id="actions-panel" class="panel">
            <h3>Actions</h3>
            <button id="click-btn">Manual Work (Click for Cash!)</button>
            <hr>
            <p>Expand City Borders (Cost: $<span id="upgrade-cost">10</span>)</p>
            <button id="upgrade-btn">Upgrade City</button>
            <hr>
            <p>High Stakes Gamble (50% chance to win/lose $100)</p>
            <button id="gamble-btn" style="background: #ff9800;">Gamble $100</button>
            <hr>
            <p>Requires Level 10. Resets progress for a permanent income multiplier.</p>
            <button id="rebirth-btn" class="danger">Rebirth World</button>
        </div>
    </div>

    <script type="module">
        // 1. IMPORT FIREBASE MODULES
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCF7biVmC_tOO-ftLGno3NCZ5tz8erSWm0",
            authDomain: "city-upgrade.firebaseapp.com",
            projectId: "city-upgrade",
            storageBucket: "city-upgrade.firebasestorage.app",
            messagingSenderId: "796551090603",
            appId: "1:796551090603:web:44d4de03e000d3b786c2ee",
            measurementId: "G-J08FL5262N"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 3. GAME STATE
        let state = {
            money: 0,
            level: 1,
            rebirths: 0,
            cityUpgrades: 0
        };
        let currentUser = null;

        // UI Element References
        const elMoney = document.getElementById('money-display');
        const elIncome = document.getElementById('income-display');
        const elLevel = document.getElementById('level-display');
        const elRebirth = document.getElementById('rebirth-display');
        const elMultiplier = document.getElementById('multiplier-display');
        const elUpgradeCost = document.getElementById('upgrade-cost');
        
        // Math Functions
        function getMultiplier() { return 1 + (state.rebirths * 1.5); }
        function getIncome() { return (state.cityUpgrades * 2) * getMultiplier(); }
        function getUpgradeCost() { return Math.floor(10 * Math.pow(1.5, state.cityUpgrades)); }

        function updateUI() {
            elMoney.textContent = Math.floor(state.money);
            elIncome.textContent = getIncome().toFixed(1);
            elLevel.textContent = state.level;
            elRebirth.textContent = state.rebirths;
            elMultiplier.textContent = getMultiplier().toFixed(1);
            elUpgradeCost.textContent = getUpgradeCost();
        }

        // 4. CLOUD SAVING SYSTEM
        async function saveGame() {
            if (!currentUser) return; // Only save if logged in
            try {
                await setDoc(doc(db, "users", currentUser.uid), state);
            } catch (e) {
                console.error("Error saving data to Firebase: ", e);
            }
        }

        async function loadGame() {
            if (!currentUser) return;
            try {
                const docSnap = await getDoc(doc(db, "users", currentUser.uid));
                if (docSnap.exists()) {
                    state = docSnap.data();
                    if(cityMesh) cityMesh.scale.setScalar(1 + (state.cityUpgrades * 0.2));
                    updateUI();
                }
            } catch (e) {
                console.error("Error loading data: ", e);
            }
        }

        // Authentication Listeners
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const userInfo = document.getElementById('user-info');
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');

            if (user) {
                userInfo.textContent = `Player: ${user.displayName}`;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                loadGame(); 
            } else {
                userInfo.textContent = 'Not logged in';
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
            }
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => console.error(error));
        });
        
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // 5. GAME BUTTON MECHANICS
        document.getElementById('click-btn').addEventListener('click', () => {
            state.money += 1 * getMultiplier();
            updateUI();
        });

        document.getElementById('upgrade-btn').addEventListener('click', () => {
            const cost = getUpgradeCost();
            if (state.money >= cost) {
                state.money -= cost;
                state.cityUpgrades++;
                
                // Level progression
                if (state.cityUpgrades % 5 === 0) state.level++;
                
                // Visually expand city on the globe
                if (cityMesh) cityMesh.scale.setScalar(1 + (state.cityUpgrades * 0.2));
                
                updateUI();
                saveGame();
            }
        });

        document.getElementById('gamble-btn').addEventListener('click', () => {
            if (state.money >= 100) {
                if (Math.random() > 0.5) {
                    state.money += 100;
                    alert("Lucky! You won $100.");
                } else {
                    state.money -= 100;
                    alert("Ouch. You lost $100.");
                }
                updateUI();
                saveGame();
            } else {
                alert("You need at least $100 to gamble!");
            }
        });

        document.getElementById('rebirth-btn').addEventListener('click', () => {
            if (state.level >= 10) {
                if (confirm("Execute Rebirth? You lose all cash and borders, but gain a permanent x1.5 multiplier per rebirth!")) {
                    state.rebirths++;
                    state.money = 0;
                    state.level = 1;
                    state.cityUpgrades = 0;
                    if (cityMesh) cityMesh.scale.setScalar(1);
                    updateUI();
                    saveGame();
                }
            } else {
                alert("You must reach Level 10 before you can Rebirth!");
            }
        });

        // Game Loop (Passive income + Auto-save)
        setInterval(() => {
            state.money += getIncome();
            updateUI();
        }, 1000); // 1 second intervals

        setInterval(() => {
            saveGame();
        }, 15000); // Auto-save every 15 seconds

        // 6. THREE.JS 3D ENVIRONMENT
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // Procedural Globe (No external images to prevent 404s)
        const globeGeometry = new THREE.SphereGeometry(2, 32, 32);
        const globeMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x0a192f, 
            emissive: 0x000000, 
            flatShading: true 
        });
        const earth = new THREE.Mesh(globeGeometry, globeMaterial);
        scene.add(earth);

        // Add a wireframe cage around the globe for aesthetics
        const wireframeMaterial = new THREE.LineBasicMaterial({ color: 0x4CAF50, transparent: true, opacity: 0.3 });
        const wireframe = new THREE.LineSegments(new THREE.WireframeGeometry(globeGeometry), wireframeMaterial);
        earth.add(wireframe);

        // Starting City Marker
        const cityGeometry = new THREE.SphereGeometry(0.08, 16, 16);
        const cityMaterial = new THREE.MeshBasicMaterial({ color: 0xff3333 });
        const cityMesh = new THREE.Mesh(cityGeometry, cityMaterial);
        cityMesh.position.set(2, 0, 0); // Position on equator
        earth.add(cityMesh);

        camera.position.z = 6;

        // Interaction for Spinning the Earth
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        document.addEventListener('mousedown', (e) => {
            if(e.target.tagName !== 'BUTTON') isDragging = true;
        });
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                earth.rotation.y += deltaMove.x * 0.005;
                earth.rotation.x += deltaMove.y * 0.005;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) {
                earth.rotation.y += 0.001; // Slow auto-spin
            }
            renderer.render(scene, camera);
        }
        
        // Initialize
        updateUI();
        animate();
    </script>
</body>
</html>
